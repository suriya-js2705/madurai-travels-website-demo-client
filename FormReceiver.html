<form id="contactForm">
  <input type="text" name="name" placeholder="Your full name" required>
  <input type="email" name="email" placeholder="your@email.com" required>
  <input type="text" name="phone" placeholder="Phone (Optional)">
  <textarea name="message" placeholder="Tell us about your travel needs..." required></textarea>
  <button type="submit">Send Message</button>
</form>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyS_tsBHr6WZ8ZKjdUvHQPuIusvEIlnwppumqZ57lCAONwHoeLxgrABpghKFMHqdk43IA/exec';
  const form = document.getElementById('contactForm');

  form.addEventListener('submit', e => {
    e.preventDefault();

    const formData = {
      name: form.name.value,
      email: form.email.value,
      phone: form.phone.value,
      message: form.message.value
    };

    fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(formData),
      headers: {
        'Content-Type': 'application/json'
      }
    })
    .then(response => {
      alert("Message sent successfully!");
      form.reset();
    })
    .catch(error => {
      console.error('Error!', error.message);
      alert("Something went wrong. Please try again later.");
    });
  });
</script>
